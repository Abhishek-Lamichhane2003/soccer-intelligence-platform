name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: ci-secret-that-is-long-enough-for-validation-only
      FOOTBALL_DATA_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests ml
      - run: python -m compileall -q app ml
      - run: alembic upgrade head
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure dependency lock exists for this build
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config >/dev/null
      - run: cp .env.production.example .env.production
      - run: docker compose -f docker-compose.prod.yml --env-file .env.production config >/dev/null
      - name: Generate frontend lock for container build if repository does not have one yet
        run: docker run --rm -v "$PWD/frontend:/app" -w /app node:22-alpine npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: docker build -t soccer-intel-backend ./backend
      - run: docker build -t soccer-intel-frontend ./frontend
